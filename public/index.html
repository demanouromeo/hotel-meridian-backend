    <!--
      title: kept as a fallback for the instant before React mounts and for any crawler that
      doesn't run JS. Every route overrides it (and the meta description / canonical link below)
      via the <Seo> component (frontend/src/components/common/Seo.tsx) — do NOT add a static
      <meta name="description"> or <link rel="canonical"> here, React does not reliably replace
      duplicates of those and the static one wins for crawlers that read the raw HTML.
    -->
    <title>Hôtel Meridian — Hôtel à Bamenda, Cameroun</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Hôtel Meridian" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Hôtel Meridian — Hôtel à Bamenda, Cameroun" />
    <meta
      property="og:description"
      content="Chambres et suites, salle de conférence, salle de fête, traiteur et plus. Réservation en ligne, paiement Mobile Money ou à l'hôtel."
    />
    <meta property="og:image" content="https://www.hotel-meridian.example/og-image.jpg" />
    <meta property="og:url" content="https://www.hotel-meridian.example/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hôtel Meridian — Hôtel à Bamenda, Cameroun" />
    <meta
      name="twitter:description"
      content="Chambres et suites, salle de conférence, salle de fête, traiteur et plus. Réservation en ligne, paiement Mobile Money ou à l'hôtel."
    />
    <meta name="twitter:image" content="https://www.hotel-meridian.example/og-image.jpg" />
